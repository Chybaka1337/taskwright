[tool.poetry]
name = "taskwright"
version = "0.1.0"
description = "Typed contracts + Runtime for categories of game-telemetry analytics tasks (supervised / unsupervised / deterministic)."
authors = ["zommer <zommer.03@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "taskwright", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5"
pandas = "^2.0"
scikit-learn = "^1.3"
joblib = "^1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
